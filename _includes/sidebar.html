<div class="sidebar">
  <div class="sidebar-container">
    
    <div class="sidebar-profile">
      <div class="profile-avatar">
        <img src="{{ site.baseurl }}/public/images/profileImage.jpg" alt="{{ site.author.name }}">
        <div class="status-indicator"></div> </div>
      <div class="profile-info">
        <h1 class="site-title">
          <a href="{{ site.baseurl }}/">
            {{ site.title }}
          </a>
        </h1>
        <p class="site-tagline">{{ site.tagline }}</p>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a class="sidebar-nav-item{% if page.url == '/' %} active{% endif %}" href="{{ site.baseurl }}/">
        <span class="nav-icon">⌖</span> Home
      </a>
      <a class="sidebar-nav-item{% if page.url contains '/projetos/' %} active{% endif %}" href="{{ site.baseurl }}/projetos/">
        <span class="nav-icon">❖</span> Projetos
      </a>
      <a class="sidebar-nav-item{% if page.url contains '/tutoriais/' %} active{% endif %}" href="{{ site.baseurl }}/tutoriais/">
        <span class="nav-icon">⚡</span> Tutoriais
      </a>
      <a class="sidebar-nav-item{% if page.url contains '/sobre/' %} active{% endif %}" href="{{ site.baseurl }}/sobre/">
        <span class="nav-icon">ℹ</span> Sobre
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="social-links">
        <a href="https://github.com/data-rod" target="_blank" aria-label="GitHub">
          <img src="{{ site.baseurl }}/assets/icons/github-icon.png" alt="">
        </a>
        <a href="https://twitter.com/data_rod" target="_blank" aria-label="Twitter">
          <img src="{{ site.baseurl }}/assets/icons/twitter-icon.png" alt="">
        </a>
        <a href="mailto:britonetorl@gmail.com" aria-label="Email">
          <img src="{{ site.baseurl }}/assets/icons/email-icon.png" alt="">
        </a>
      </div>

      <div class="audio-control-panel">
        <audio id="audio" src="{{ site.baseurl }}/assets/audio/track1.mp3"></audio>
        <div class="player-buttons">
          <button id="prev" class="player-btn" title="Previous">⏮</button>
          <button id="play-pause" class="player-btn play-main" title="Play/Pause">▶</button>
          <button id="next" class="player-btn" title="Next">⏭</button>
        </div>
        <div class="equalizer-bar"></div>
      </div>
      
      <p class="copyright">&copy; {{ site.time | date: '%Y' }}. v{{ site.version }}</p>
    </div>

  </div>
</div>
