<!DOCTYPE html>
<html lang="pt-br">

  {% include head.html %}

  <body>

    {% include sidebar.html %}

    <div class="content container">
      {{ content }}
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        
        // --- MOBILE MENU LOGIC ---
        const menuBtn = document.getElementById("mobile-menu-toggle");
        const sidebarContent = document.getElementById("sidebar-content");
        
        if(menuBtn && sidebarContent) {
          menuBtn.addEventListener("click", function() {
            sidebarContent.classList.toggle("active");
            menuBtn.textContent = sidebarContent.classList.contains("active") ? "✕" : "☰";
          });
        }

        // --- AUDIO PLAYER LOGIC ---
        const audio = document.getElementById("audio");
        const playPauseButton = document.getElementById("play-pause");
        const prevButton = document.getElementById("prev");
        const nextButton = document.getElementById("next");
  
        // Playlist (ajuste os caminhos se necessário)
        const tracks = [
          "{{ site.baseurl }}/assets/audio/track1.mp3",
          "{{ site.baseurl }}/assets/audio/track2.mp3",
          "{{ site.baseurl }}/assets/audio/track3.mp3",
          "{{ site.baseurl }}/assets/audio/track4.mp3",
          "{{ site.baseurl }}/assets/audio/track5.mp3",
        ];
        
        let currentTrack = 0;
  
        if(playPauseButton && audio) {
          playPauseButton.addEventListener("click", function() {
            if (audio.paused) {
              audio.play();
              playPauseButton.textContent = "⏸"; // Pause icon
            } else {
              audio.pause();
              playPauseButton.textContent = "▶"; // Play icon
            }
          });
    
          prevButton.addEventListener("click", function() {
            currentTrack = (currentTrack > 0) ? currentTrack - 1 : tracks.length - 1;
            audio.src = tracks[currentTrack];
            audio.play();
            playPauseButton.textContent = "⏸";
          });
    
          nextButton.addEventListener("click", function() {
            currentTrack = (currentTrack < tracks.length - 1) ? currentTrack + 1 : 0;
            audio.src = tracks[currentTrack];
            audio.play();
            playPauseButton.textContent = "⏸";
          });
        }
      });
    </script>
  </body>
</html>
